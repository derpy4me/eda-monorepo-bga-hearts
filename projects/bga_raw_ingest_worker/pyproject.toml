[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "bga_raw_ingest_worker"
version = "0.1.0"

authors = [
    { name = "Tom Scott", email = "tscott@stratanetworks.com" }
]

requires-python = ">= 3.10"

dependencies = [
    "surrealdb>=1.0.4",
    "faust-streaming[fast]>=0.11.3",
    "uuid-utils>=0.11.0",
]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/bce/bga_raw_ingest_worker" = "bce/bga_raw_ingest_worker"
"../../components/bce/surrealdb_manager_lib" = "bce/surrealdb_manager_lib"
